<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#23262E" />
    <meta
      name="description"
      content="Nook — Block Puzzle. A calm 8×8 block puzzle. Every piece finds its nook."
    />
    <title>Nook — Block Puzzle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <nav id="modes" aria-label="game mode">
          <button id="mode-endless" type="button" class="mode is-on">endless</button>
          <button id="mode-daily" type="button" class="mode">today</button>
        </nav>
        <div id="score-plate">
          <span id="score" class="score-digits">0</span>
        </div>
        <p id="daily-label" hidden></p>
        <div id="run-indicator" aria-hidden="true"></div>
      </header>

      <div id="stage-wrap"><canvas id="stage"></canvas></div>

      <div id="panel" class="panel" hidden>
        <p class="panel-title">nowhere left to put it</p>
        <p class="panel-score"><span id="panel-score">0</span></p>
        <p class="panel-best">best <span id="panel-best">0</span></p>
        <div class="panel-actions">
          <button id="restart" type="button">again</button>
          <button id="share" type="button" hidden>share</button>
        </div>
        <p id="share-note" class="panel-note" aria-live="polite"></p>
      </div>

      <div id="announcer" class="visually-hidden" aria-live="polite" role="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
